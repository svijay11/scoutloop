[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoutloop"
version = "0.1.0"
description = "Outbound prospecting agent for developer tools"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "tavily-python>=0.5.0",
]

[project.scripts]
scoutloop = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]
